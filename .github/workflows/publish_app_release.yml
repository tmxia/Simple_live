name: Build & Release App & TV

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: 构建 App 端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 读取 App 版本号
        id: get_ver
        run: |
          APP_VER=$(grep '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "App 版本: $APP_VER"

      - name: 解码 Keystore 并生成 App 签名
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks
          test -s ${{ github.workspace }}/keystore.jks || { echo "❌ Keystore 为空"; exit 1; }
          printf "storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" \
            "${{ github.workspace }}/keystore.jks" \
            "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_ALIAS }}" > simple_live_app/android/key.properties

      - name: 全面修复构建环境 & 代码语法
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip|g' simple_live_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "9.3.1"/g' simple_live_app/android/settings.gradle.kts || true
          sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.4.20"/g' simple_live_app/android/settings.gradle.kts || true
          
          if ! grep -q "android.newDsl" simple_live_app/android/gradle.properties; then
            echo "android.newDsl=false" >> simple_live_app/android/gradle.properties
          fi
          
          sed -i '/isV1SigningEnabled/d' simple_live_app/android/app/build.gradle.kts || true
          sed -i '/isV2SigningEnabled/d' simple_live_app/android/app/build.gradle.kts || true
          sed -i '/kotlinOptions/,/}/d' simple_live_app/android/app/build.gradle.kts || true
          
          echo "" >> simple_live_app/android/app/build.gradle.kts
          echo "android {" >> simple_live_app/android/app/build.gradle.kts
          echo "    lint {" >> simple_live_app/android/app/build.gradle.kts
          echo "        checkReleaseBuilds = false" >> simple_live_app/android/app/build.gradle.kts
          echo "        abortOnError = false" >> simple_live_app/android/app/build.gradle.kts
          echo "    }" >> simple_live_app/android/app/build.gradle.kts
          echo "    compileOptions {" >> simple_live_app/android/app/build.gradle.kts
          echo "        sourceCompatibility = JavaVersion.VERSION_17" >> simple_live_app/android/app/build.gradle.kts
          echo "        targetCompatibility = JavaVersion.VERSION_17" >> simple_live_app/android/app/build.gradle.kts
          echo "    }" >> simple_live_app/android/app/build.gradle.kts
          echo "}" >> simple_live_app/android/app/build.gradle.kts

      - name: 编译 App 端 Release APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          INAPPWEBVIEW_GRADLE=$(find ~/.pub-cache -path "*flutter_inappwebview_android*/android/build.gradle" | head -n 1)
          if [ -n "$INAPPWEBVIEW_GRADLE" ]; then
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$INAPPWEBVIEW_GRADLE"
          fi
          flutter build apk --release --split-per-abi

      - name: 收集 App 产物
        run: |
          mkdir -p output/app
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="simple_live_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "output/app/SimpleLive-App-v${{ steps.get_ver.outputs.app_ver }}-${abi}.apk"
            fi
          done

      - name: 上传 App 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: output/app/*.apk
          retention-days: 1

  build-tv:
    name: 构建 TV 端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 读取 TV 版本号
        id: get_ver
        run: |
          TV_VER=$(grep '^version:' simple_live_tv_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tv_ver=$TV_VER" >> $GITHUB_OUTPUT
          echo "TV 版本: $TV_VER"

      - name: 解码 Keystore 并生成 TV 签名
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks
          test -s ${{ github.workspace }}/keystore.jks || { echo "❌ Keystore 为空"; exit 1; }
          printf "storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" \
            "${{ github.workspace }}/keystore.jks" \
            "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_ALIAS }}" > simple_live_tv_app/android/key.properties

      - name: 全面修复构建环境 & 代码语法
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip|g' simple_live_tv_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "9.3.1"/g' simple_live_tv_app/android/settings.gradle.kts || true
          sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.4.20"/g' simple_live_tv_app/android/settings.gradle.kts || true
          
          if ! grep -q "android.newDsl" simple_live_tv_app/android/gradle.properties; then
            echo "android.newDsl=false" >> simple_live_tv_app/android/gradle.properties
          fi
          
          sed -i '/isV1SigningEnabled/d' simple_live_tv_app/android/app/build.gradle.kts || true
          sed -i '/isV2SigningEnabled/d' simple_live_tv_app/android/app/build.gradle.kts || true
          sed -i '/kotlinOptions/,/}/d' simple_live_tv_app/android/app/build.gradle.kts || true
          
          echo "" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "android {" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "    lint {" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "        checkReleaseBuilds = false" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "        abortOnError = false" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "    }" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "    compileOptions {" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "        sourceCompatibility = JavaVersion.VERSION_17" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "        targetCompatibility = JavaVersion.VERSION_17" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "    }" >> simple_live_tv_app/android/app/build.gradle.kts
          echo "}" >> simple_live_tv_app/android/app/build.gradle.kts

      - name: 编译 TV 端 Release APK
        working-directory: ./simple_live_tv_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 收集 TV 产物
        run: |
          mkdir -p output/tv
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="simple_live_tv_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "output/tv/SimpleLive-TV-v${{ steps.get_ver.outputs.tv_ver }}-${abi}.apk"
            fi
          done

      - name: 上传 TV 产物
        uses: actions/upload-artifact@v4
        with:
          name: tv-apks
          path: output/tv/*.apk
          retention-days: 1

  release:
    name: 创建 GitHub Release
    needs: [build-app, build-tv]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 App 产物
        uses: actions/download-artifact@v4
        with:
          name: app-apks
          path: output

      - name: 下载 TV 产物
        uses: actions/download-artifact@v4
        with:
          name: tv-apks
          path: output

      - name: 读取版本号
        id: ver
        run: |
          APP_VER=$(grep '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TV_VER=$(grep '^version:' simple_live_tv_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "tv_ver=$TV_VER" >> $GITHUB_OUTPUT

      - name: 清理旧的 Release 与 Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.ver.outputs.app_ver }}"
          gh release delete "$TAG_NAME" --yes || true
          git push --delete origin "$TAG_NAME" || true
          git tag -d "$TAG_NAME" || true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ steps.ver.outputs.app_ver }}
          RELEASE_TITLE: Release App v${{ steps.ver.outputs.app_ver }} & TV v${{ steps.ver.outputs.tv_ver }}
          APP_VER: ${{ steps.ver.outputs.app_ver }}
          TV_VER: ${{ steps.ver.outputs.tv_ver }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，跳过创建"
          else
            gh release create "$TAG_NAME" --title "$RELEASE_TITLE" --notes "App v${APP_VER} / TV v${TV_VER} / Auto-built by GitHub Actions" --target master --latest
          fi

      - name: 上传 APK 至 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ steps.ver.outputs.app_ver }}
        run: |
          gh release upload "$TAG_NAME" output/*.apk --clobber

  cleanup_old_runs:
    name: 强力清理历史与死锁记录
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old and stuck runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish_app_release.yml',
              per_page: 100
            });
            const now = new Date().getTime();
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const createdTime = new Date(run.created_at).getTime();
              const diffMins = (now - createdTime) / 1000 / 60;
              
              // 强力清理：已完成，或者排队/运行中超过 120 分钟的死锁任务
              if (run.status === 'completed' || (['queued', 'in_progress'].includes(run.status) && diffMins > 120)) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  console.log(`已强制删除: ${run.id} (状态: ${run.status})`);
                } catch (e) {
                  console.log(`删除失败 ${run.id}: ${e.message}`);
                }
              }
            }
