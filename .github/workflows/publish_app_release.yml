name: Build & Release App & TV

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 并行任务 1：编译 App 端
  # ==========================================
  build-app:
    name: 构建 App 端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 读取 App 版本号
        id: get_ver
        run: |
          APP_VER=$(grep '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "App 版本: $APP_VER"

      - name: 解码 Keystore 并生成 App 签名
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks
          test -s ${{ github.workspace }}/keystore.jks || { echo "❌ Keystore 为空"; exit 1; }
          printf "storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" \
            "${{ github.workspace }}/keystore.jks" \
            "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_ALIAS }}" > simple_live_app/android/key.properties

      - name: 修复 Gradle & AGP & Kotlin 版本
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip|g' simple_live_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.11.1"/g' simple_live_app/android/settings.gradle.kts || true
          sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' simple_live_app/android/settings.gradle.kts || true
          sed -i "s/id 'com.android.application' version '.*'/id 'com.android.application' version '8.11.1'/g" simple_live_app/android/settings.gradle || true
          sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '2.2.20'/g" simple_live_app/android/settings.gradle || true
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '2.2.20'/g" simple_live_app/android/build.gradle || true

      - name: 编译 App 端 Release APK (分架构)
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 收集 App 产物
        run: |
          mkdir -p output/app
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="simple_live_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "output/app/SimpleLive-App-v${{ steps.get_ver.outputs.app_ver }}-${abi}.apk"
            fi
          done
          ls -lh output/app/

      - name: 上传 App 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: output/app/*.apk
          retention-days: 1

  # ==========================================
  # 并行任务 2：编译 TV 端
  # ==========================================
  build-tv:
    name: 构建 TV 端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 读取 TV 版本号
        id: get_ver
        run: |
          TV_VER=$(grep '^version:' simple_live_tv_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tv_ver=$TV_VER" >> $GITHUB_OUTPUT
          echo "TV 版本: $TV_VER"

      - name: 解码 Keystore 并生成 TV 签名
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks
          test -s ${{ github.workspace }}/keystore.jks || { echo "❌ Keystore 为空"; exit 1; }
          printf "storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" \
            "${{ github.workspace }}/keystore.jks" \
            "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_ALIAS }}" > simple_live_tv_app/android/key.properties

      - name: 修复 Gradle & AGP & Kotlin 版本
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip|g' simple_live_tv_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.11.1"/g' simple_live_tv_app/android/settings.gradle.kts || true
          sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' simple_live_tv_app/android/settings.gradle.kts || true
          sed -i "s/id 'com.android.application' version '.*'/id 'com.android.application' version '8.11.1'/g" simple_live_tv_app/android/settings.gradle || true
          sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '2.2.20'/g" simple_live_tv_app/android/settings.gradle || true
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '2.2.20'/g" simple_live_tv_app/android/build.gradle || true

      - name: 编译 TV 端 Release APK (分架构)
        working-directory: ./simple_live_tv_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 收集 TV 产物
        run: |
          mkdir -p output/tv
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="simple_live_tv_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "output/tv/SimpleLive-TV-v${{ steps.get_ver.outputs.tv_ver }}-${abi}.apk"
            fi
          done
          ls -lh output/tv/

      - name: 上传 TV 产物
        uses: actions/upload-artifact@v4
        with:
          name: tv-apks
          path: output/tv/*.apk
          retention-days: 1

  # ==========================================
  # 汇总任务：发布 Release (等待 App 和 TV 都完成)
  # ==========================================
  release:
    name: 创建 GitHub Release
    needs: [build-app, build-tv]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 App 产物
        uses: actions/download-artifact@v4
        with:
          name: app-apks
          path: output

      - name: 下载 TV 产物
        uses: actions/download-artifact@v4
        with:
          name: tv-apks
          path: output

      - name: 读取版本号
        id: ver
        run: |
          APP_VER=$(grep '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TV_VER=$(grep '^version:' simple_live_tv_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "tv_ver=$TV_VER" >> $GITHUB_OUTPUT

      - name: 清理旧的 Release 与 Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.ver.outputs.app_ver }}"
          gh release delete "$TAG_NAME" --yes || true
          git push --delete origin "$TAG_NAME" || true

      - name: 发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.app_ver }}
          name: Release App v${{ steps.ver.outputs.app_ver }} & TV v${{ steps.ver.outputs.tv_ver }}
          body: |
            Auto-built APK by GitHub Actions.
            - **App 版本**: v${{ steps.ver.outputs.app_ver }}
            - **TV 版本**: v${{ steps.ver.outputs.tv_ver }}
            已按架构拆分打包，请根据设备选择 arm64-v8a 下载。
          files: output/*.apk
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true

  # ==========================================
  # 清理任务
  # ==========================================
  cleanup_old_runs:
    name: 清理历史记录
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish_app_release.yml',
              per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id !== context.runId && run.status === 'completed') {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                } catch (e) {
                  console.log(`Failed to delete ${run.id}: ${e.message}`);
                }
              }
            }
