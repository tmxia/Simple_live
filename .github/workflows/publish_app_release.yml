name: Build & Release App & TV

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 提取版本号
        id: get_ver
        run: |
          APP_VER=$(grep '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TV_VER=$(grep '^version:' simple_live_tv_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "tv_ver=$TV_VER" >> $GITHUB_OUTPUT
          echo "App 版本: $APP_VER, TV 版本: $TV_VER"

      - name: 解码 Keystore 并生成签名配置
        run: |
          # 1. 将 Secrets 解码到仓库根目录
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks
          test -s ${{ github.workspace }}/keystore.jks || { echo "❌ Keystore 为空"; exit 1; }

          # 2. 用 printf 无缩进生成 App 的 key.properties
          printf "storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" \
            "${{ github.workspace }}/keystore.jks" \
            "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_ALIAS }}" > simple_live_app/android/key.properties

          # 3. 用 printf 无缩进生成 TV 的 key.properties
          printf "storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" \
            "${{ github.workspace }}/keystore.jks" \
            "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            "${{ secrets.RELEASE_KEY_ALIAS }}" > simple_live_tv_app/android/key.properties

      - name: 修复 Gradle & AGP & Kotlin 版本兼容性
        run: |
          # 1. 强制 Gradle 到 8.14
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip|g' simple_live_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip|g' simple_live_tv_app/android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. 强制 AGP 到 8.11.1
          for dir in simple_live_app simple_live_tv_app; do
            sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.11.1"/g' $dir/android/settings.gradle.kts || true
            sed -i "s/id 'com.android.application' version '.*'/id 'com.android.application' version '8.11.1'/g" $dir/android/settings.gradle || true
            
            # 3. 强制 Kotlin 到 2.2.20
            sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' $dir/android/settings.gradle.kts || true
            sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '2.2.20'/g" $dir/android/settings.gradle || true
            sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '2.2.20'/g" $dir/android/build.gradle || true
            sed -i 's/ext.kotlin_version = ".*"/ext.kotlin_version = "2.2.20"/g' $dir/android/build.gradle.kts || true
          done

      # ---------------- 编译 App 端 ----------------
      - name: 编译 App 端 Release APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      # ---------------- 编译 TV 端 ----------------
      - name: 编译 TV 端 Release APK
        working-directory: ./simple_live_tv_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 收集并重命名产物
        run: |
          mkdir -p output
          
          # App 端
          APP_VER="${{ steps.get_ver.outputs.app_ver }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="simple_live_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "output/SimpleLive-App-v${APP_VER}-${abi}.apk"
            fi
          done

          # TV 端
          TV_VER="${{ steps.get_ver.outputs.tv_ver }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="simple_live_tv_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "output/SimpleLive-TV-v${TV_VER}-${abi}.apk"
            fi
          done
          
          ls -lh output/

      - name: 上传临时 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-All-APKs
          path: output/*.apk

      - name: 强制清理旧发布与 Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.get_ver.outputs.app_ver }}"
          echo "正在检查并删除旧 Release: $TAG_NAME"
          gh release delete "$TAG_NAME" --yes || true
          
          echo "正在检查并删除旧 Git Tag: $TAG_NAME"
          git push --delete origin "$TAG_NAME" || true
          echo "✅ 旧版本清理完毕，准备覆盖发布"

      - name: 发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_ver.outputs.app_ver }}
          name: Release App v${{ steps.get_ver.outputs.app_ver }} & TV v${{ steps.get_ver.outputs.tv_ver }}
          body: |
            Auto-built APK by GitHub Actions.
            - **App 版本**: v${{ steps.get_ver.outputs.app_ver }}
            - **TV 版本**: v${{ steps.get_ver.outputs.tv_ver }}
          files: output/*.apk
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true

  # ==========================================
  # 阶段：清理当前工作流历史记录 (只保留最新)
  # ==========================================
  cleanup_old_runs:
    name: 清理历史记录
    runs-on: ubuntu-latest
    # 依赖于 build 完成，或者即使 build 失败/取消也执行
    needs: build-android
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish_app_release.yml',
              per_page: 100
            });
            
            for (const run of runs.data.workflow_runs) {
              // 只要不是当前正在运行的 ID，且状态已经是 completed，就删除
              if (run.id !== context.runId && run.status === 'completed') {
                console.log(`Deleting run ID: ${run.id}`);
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                } catch (e) {
                  console.log(`Failed to delete ${run.id}: ${e.message}`);
                }
              }
            }
